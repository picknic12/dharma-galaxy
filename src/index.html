<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다르마 갤럭시 · 다갤</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style></head><body>
<div class="app">
<header><h1>다르마 갤럭시 <small style="font-size:15px">다갤 · DHARMA GALAXY</small></h1><span class="sub">인간 vs AI · 2.5D 다중우주 경제 전략 RPG · v0.3 테스트판</span>
<div class="chips"><span class="chip" id="hRound">1일차</span><span class="chip" id="hDate"></span><span class="chip" id="hPhase"></span><span class="chip" id="hPot"></span>
<button class="btn sm" id="bMusic" title="음악">🎵</button><button class="btn sm" id="bNext" title="다음 곡">⏭</button><button class="btn sm" id="bMed" title="명상 모드">🧘</button><button class="btn sm" id="bPause" title="수동/자동 진행 (P)">✋ 수동</button><button class="btn sm" id="bSpeed" title="속도">▶</button><button class="btn sm" id="bAuto" title="AI에게 맡기기">🤖 오토</button><button class="btn sm" id="bSound" title="소리 (M)">🔊</button><button class="btn sm" id="bRules" title="규칙 (R)">📖</button><button class="btn sm" id="bSave" title="저장 (Ctrl+S)">💾</button><button class="btn sm" id="bLoad" title="불러오기">📂</button><button class="btn sm" id="bPanel" title="패널 접기/펴기 (Q)">📋</button><button class="btn sm" id="bFull" title="전체 화면 (Z)">⛶</button><button class="btn sm" id="bNew">새 게임</button></div></header>
<main class="wrap">
<section id="stage"><div class="px px1"></div><div class="px px2"></div><div id="labels"></div><div id="warp"></div>
 <div class="hud tl"><svg id="wheel" viewBox="0 0 100 100"></svg><div><div id="worldName"></div><div class="astro" id="astro"></div></div></div>
 <div class="hud tr"><button class="btn sm" id="bHome">🏠 내 우주 <kbd>H</kbd></button><div id="chakra" title="8대 차크라"></div><div id="breath"><span>들숨</span></div><div id="track" class="sub">♪ 화면을 누르면 우주 음악이 흐릅니다</div></div><div id="bloom"></div><div id="cine"></div>
 <div class="hud bc"><div class="news" id="news"></div><div class="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div><div id="act"></div></div>
</section>
<aside>
 <div class="panel"><h3>🚀 함대</h3><div id="players"></div></div>
 <div class="panel"><h3>📊 은하 시세판</h3><div id="market"></div></div>
 <div class="panel"><div class="tabs"><button data-t="assets">🪐 내 자산 <kbd>1</kbd></button><button data-t="map">🛰 상황기 <kbd>2</kbd></button><button data-t="logT">📜 기록 <kbd>3</kbd></button><button data-t="lab">🤖 연구소 <kbd>4</kbd></button><button data-t="bank">🏦 금융 <kbd>5</kbd></button></div>
  <div id="assets"></div><div id="map"></div><div id="logT"><div class="log" id="log"></div></div><div id="lab"></div><div id="bank"></div></div>
</aside></main>
<footer>© 피크닉 신영호 · 임지혜 (이스턴드래곤 출판사) · 오픈소스: three.js (MIT), anime.js (MIT), canvas-confetti (ISC) · 효과음·등급·오행 모듈: 사주RPG 재사용 라이브러리</footer>
</div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div><div id="toast"></div>
<script>/*__VENDOR__*/</script>
<script>/*__LIB__*/</script>
<script>const RULES_HTML=/*__RULES__*/;</script>
<script>/*__GAME__*/</script>
</body></html>
